<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE — Visitor UI variants (ticket 11)</title>
<!--
  THROWAWAY PROTOTYPE — ticket 11, .scratch/booth-npc-app/issues/11-...
  Three variants of the visitor UI composition, switchable via ?variant=,
  across the full screen inventory (?screen=) at real phone viewports (?device=).
  Not production code. No tests, no error handling, no build step.
  Open this file directly in a browser.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* UOB palette — from the sibling effort, UNCONFIRMED for this map (see ticket 11 comments) */
    --uob-azure:#005EB8; --uob-resolution:#00237B;
    --uob-brown:#C8BFB4; --uob-grey:#B5AEAA; --white:#fff;
    /* DERIVED, not official — no panel colour was ever given by the brand */
    --panel-dark:#141d33; --panel-dark-2:#1e2a47;
    --dialog-bg:#EDEBE4; --dialog-ink:#1a1a1a;
    --frame:#f2f2ee; --frame-edge:#9aa0ab;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#20242c;color:#e8e8e8;font-family:'Noto Sans',system-ui,sans-serif;
       min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 12px 140px}
  h1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9aa4b5;margin:0 0 4px}
  .sub{font-size:12px;color:#6f7787;margin:0 0 16px;text-align:center;max-width:640px;line-height:1.5}
  .sub code{background:#2b3140;padding:1px 5px;border-radius:3px}

  /* ---- device frame ---- */
  #stage{position:relative;background:#000;border-radius:22px;overflow:hidden;
         box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 0 8px #34394a, 0 0 0 9px #4a5163;
         flex:none;transition:width .18s,height .18s}
  #screen{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column}

  /* ---- shared pieces ---- */
  .bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .pixel{font-family:var(--pixfont,'Silkscreen'),ui-monospace,monospace;
         -webkit-font-smoothing:none;font-smooth:never;image-rendering:pixelated}
  .nameplate{display:inline-block;background:var(--uob-azure);color:#fff;
             border:3px solid #fff;border-radius:6px;padding:6px 12px;font-size:11px;
             box-shadow:0 3px 0 rgba(0,0,0,.45);margin-bottom:-3px;position:relative;z-index:2}
  .dialogbox{background:var(--dialog-bg);color:var(--dialog-ink);border:3px solid var(--frame-edge);
             border-radius:8px;padding:12px 13px;font-size:12px;line-height:1.65;
             box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .choices{background:var(--panel-dark);border:3px solid var(--frame-edge);border-radius:8px;
           margin-top:8px;overflow-y:auto;box-shadow:0 4px 0 rgba(0,0,0,.35);
           scrollbar-width:thin;scrollbar-color:var(--uob-azure) var(--panel-dark)}
  .choices::-webkit-scrollbar{width:8px}
  .choices::-webkit-scrollbar-thumb{background:var(--uob-azure);border-radius:4px}
  .opt{display:flex;align-items:center;gap:9px;padding:9px 11px;color:#dfe4ee;font-size:11px;
       border-bottom:1px solid rgba(255,255,255,.07);min-height:44px}
  .opt:last-child{border-bottom:none}
  .opt .ico{width:20px;text-align:center;flex:none;font-size:13px}
  .opt .num{color:var(--uob-grey);flex:none}
  .opt.sel{color:#FFD447}
  .opt.exit{color:#7d8598}
  .scrollhint{position:absolute;right:9px;bottom:6px;font-size:9px;color:var(--uob-grey);
              background:rgba(0,0,0,.55);padding:2px 6px;border-radius:3px;pointer-events:none}

  /* form */
  .form{background:var(--frame);color:#1a1a1a;border:3px solid var(--frame-edge);border-radius:10px;padding:13px}
  .form h2{font-size:11px;margin:0 0 10px;background:var(--uob-azure);color:#fff;
           padding:7px 10px;border-radius:5px;text-align:center;letter-spacing:.04em}
  .form label{display:block;font-size:9.5px;margin:8px 0 3px;font-weight:700}
  .form input{width:100%;font-size:11px;padding:8px;border:2px solid #b9bec8;border-radius:4px;
              background:#e4e2da;font-family:inherit;min-height:38px}
  .consent{display:flex;gap:7px;align-items:flex-start;margin-top:10px;font-size:8.5px;line-height:1.5}
  .consent input{margin-top:2px;width:15px;height:15px;flex:none}
  .notice{font-size:7.5px;color:#4a4a4a;margin-top:9px;line-height:1.55;border-top:1px solid #c9c9c2;padding-top:7px}
  .btnrow{display:flex;gap:8px;margin-top:11px}
  .btn{flex:1;padding:10px;border-radius:5px;font-size:10px;text-align:center;border:2px solid #7f8794;
       background:#d8d6cf;color:#222;min-height:42px;display:flex;align-items:center;justify-content:center}
  .btn.primary{background:var(--uob-azure);color:#fff;border-color:#fff}

  /* cta */
  .cta-card{background:var(--panel-dark);border:3px solid var(--frame-edge);border-radius:9px;padding:13px}
  .cta-card h2{font-size:11px;margin:0 0 11px;color:#fff;text-align:center;line-height:1.6}
  .cta-opt{display:flex;align-items:center;gap:10px;padding:12px 11px;border-radius:6px;
           background:var(--panel-dark-2);border:2px solid #39435e;margin-bottom:8px;font-size:10.5px;
           color:#dfe4ee;min-height:48px}
  .cta-opt.hero{background:var(--uob-azure);border-color:#fff;color:#fff}
  .band{font-size:8px;color:var(--uob-grey);text-align:center;margin-top:6px;letter-spacing:.1em}

  .center-msg{margin:auto;text-align:center;padding:26px}
  .center-msg .big{font-size:13px;color:#fff;margin-bottom:9px;line-height:1.7}
  .center-msg .small{font-size:10px;color:var(--uob-grey);line-height:1.7}
  .spinner{width:26px;height:26px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;
           border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---- measurement overlay ---- */
  #measure{position:absolute;top:0;left:0;right:0;background:rgba(255,60,60,.93);color:#fff;
           font:10px/1.5 ui-monospace,monospace;padding:5px 7px;z-index:9;display:none;white-space:pre-wrap}
  body.measuring #measure{display:block}
  body.measuring .dialogbox{outline:2px dashed #ff3c3c}
  body.measuring .choices{outline:2px dashed #38d67a}

  /* ---- controls ---- */
  #bar{position:fixed;bottom:0;left:0;right:0;background:#11141b;border-top:1px solid #2c3240;
       padding:9px 12px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;z-index:50}
  .grp{display:flex;align-items:center;gap:5px;background:#1b202b;border:1px solid #2f3646;
       border-radius:999px;padding:4px 7px}
  .grp b{font-size:8.5px;color:#6f7787;text-transform:uppercase;letter-spacing:.09em;padding:0 3px}
  .grp button{background:#2a3140;color:#dfe4ee;border:1px solid #3a4358;border-radius:999px;
              padding:5px 9px;font-size:10.5px;cursor:pointer;font-family:inherit}
  .grp button:hover{background:#38415a}
  .grp button.on{background:var(--uob-azure);border-color:#7fb2e8;color:#fff}
  .vlabel{min-width:132px;text-align:center;font-size:10.5px;color:#fff}
  select{background:#2a3140;color:#dfe4ee;border:1px solid #3a4358;border-radius:5px;
         padding:5px 7px;font-size:10.5px;font-family:inherit}
</style>
</head>
<body>

<h1>Prototype — visitor UI composition</h1>
<p class="sub">Ticket 11. Three <b>structurally different</b> compositions of the four fixed assets.
Switch with <code>← →</code> or the bar below. <b>M</b> toggles measurements, which is where the
character budget for ticket 13 comes from.</p>

<div id="stage"><div id="screen"></div><div id="measure"></div></div>

<div id="bar">
  <div class="grp"><b>Variant</b>
    <button id="prev">◀</button><span class="vlabel" id="vlabel"></span><button id="next">▶</button>
  </div>
  <div class="grp"><b>Screen</b><select id="screenSel"></select></div>
  <div class="grp"><b>Device</b><select id="devSel"></select></div>
  <div class="grp"><b>Font</b><select id="fontSel"></select></div>
  <div class="grp"><button id="measBtn">Measure (M)</button></div>
</div>

<script>
const A = '../../../Game%20Assets/';
const BG = A + 'Background%20Screen.jpg';

const DEVICES = {
  'iphone-se':   {w:375,h:667,label:'iPhone SE — 375×667 (short)'},
  'android-sm':  {w:360,h:640,label:'Budget Android — 360×640'},
  'iphone-14':   {w:390,h:844,label:'iPhone 14 — 390×844'},
  'pro-max':     {w:430,h:932,label:'iPhone Pro Max — 430×932'},
  'tablet':      {w:768,h:1024,label:'Fallback tablet — 768×1024 (ticket 15)'}
};
const FONTS = {
  'silkscreen':{css:"'Silkscreen'",label:'Silkscreen (OFL)'},
  'pressstart':{css:"'Press Start 2P'",label:'Press Start 2P (OFL) — very wide'},
  'mono':{css:"ui-monospace",label:'System monospace (no webfont)'},
  'noto':{css:"'Noto Sans'",label:'Noto Sans (UOB brand) — not pixel'}
};

const SEVEN = [
  ['🚀','Growing'],['💰','Managing Cash'],['💳','Payments'],['🏦','Financing'],
  ['🌏','Managing Risk'],['⚙️','Digitalising'],['💡','Just Exploring']
];
const NEED_PAY = [
  ['🔧','Too manual'],['🗂️','Too many platforms'],['🌏','Cross-border'],
  ['📊','Reconciliation'],['⚡','Getting paid faster'],['💵','Processing time or cost']
];
const TIMELINE = [
  ['🔥','Immediately / <1 month'],['📅','1–3 months'],['🗓️','3–6 months'],
  ['📆','6–12 months'],['💭','Just exploring']
];
const INTENT = [['🔥','Actively looking'],['🟠','Considering options'],['🟡','Just researching']];

const SCREENS = {
  splash:   {label:'1. Splash / cold load', kind:'msg'},
  checkin:  {label:'2. Check-in form',      kind:'form'},
  interest: {label:'3. Node — interest (7, scrolls)', kind:'node',
             npc:'Welcome to UOB! What’s most relevant to your business at the moment?', opts:SEVEN},
  need:     {label:'4. Node — need (payments)', kind:'node',
             npc:'Payments it is. What’s the biggest challenge today?', opts:NEED_PAY},
  timeline: {label:'5. Node — timeline', kind:'node',
             npc:'Got it. When are you looking to address this?', opts:TIMELINE},
  intent:   {label:'6. Node — intent', kind:'node',
             npc:'Last one. How are you looking to address this today?', opts:INTENT},
  cta:      {label:'7. CTA / results (HOT)', kind:'cta'},
  offline:  {label:'8. Offline / queued', kind:'msg'}
};

const VARIANTS = {
  A:{name:'Overlay (faithful)',   render:renderA},
  B:{name:'Letterbox stage',      render:renderB},
  C:{name:'Adaptive bottom sheet',render:renderC}
};

/* ---------- shared fragments ---------- */
function optRows(opts,{sel=0,exit=true}={}){
  let h='';
  opts.forEach((o,i)=>{
    h+=`<div class="opt pixel ${i===sel?'sel':''}"><span class="ico">${o[0]}</span>
        <span class="num">${i+1}.</span><span class="lbl">${o[1]}</span></div>`;
  });
  if(exit) h+=`<div class="opt exit pixel"><span class="ico">✕</span><span class="num"></span>
               <span class="lbl">I'm just looking around</span></div>`;
  return h;
}
function dialog(npc){
  return `<div class="nameplate pixel">UOB Receptionist</div>
          <div class="dialogbox pixel" data-dlg>${npc}</div>`;
}
function formHTML(){
  return `<div class="form pixel">
    <h2>CONTACT INFORMATION</h2>
    <label>Full Name</label><input placeholder="Enter your full name">
    <label>Company Name</label><input placeholder="Enter your company">
    <label>Company Email</label><input placeholder="you@company.com">
    <label>Role</label><input placeholder="Owner / C-suite / Director ▾">
    <label>Phone <span style="font-weight:400;opacity:.65">(optional)</span></label>
    <input placeholder="Optional">
    <div class="consent"><input type="checkbox">
      <span>I agree that UOB may contact me about the solutions we discuss here today.</span></div>
    <div class="consent"><input type="checkbox">
      <span>UOB may call or SMS me on this number about those solutions.</span></div>
    <div class="notice">United Overseas Bank Limited collects your name, company email and role to follow up on this
      conversation. We keep it for 90 days, then delete it. To withdraw, speak to our booth staff or
      contact dataprotectionofficer@uobgroup.com.</div>
    <div class="btnrow"><div class="btn">CANCEL</div><div class="btn primary">SUBMIT</div></div>
  </div>`;
}
function ctaHTML(){
  return `<div class="cta-card pixel">
    <h2>How can we help you from here?</h2>
    <div class="cta-opt hero"><span>👤</span><span>Talk to a Specialist</span></div>
    <div class="cta-opt"><span>📩</span><span>Send Me Information</span></div>
    <div class="cta-opt"><span>🔎</span><span>Explore More Solutions</span></div>
    <div class="band">BAND: HOT · 95 — never shown to the visitor</div>
  </div>`;
}
function msgHTML(k){
  return k==='splash'
    ? `<div class="center-msg pixel"><div class="spinner"></div>
       <div class="big">UOB</div><div class="small">Loading…</div></div>`
    : `<div class="center-msg pixel"><div class="big">Thanks — we'll be in touch.</div>
       <div class="small">(Queued offline. The visitor is never shown an error;<br>
       the queue retries silently. — ticket 08)</div></div>`;
}

/* ---------- VARIANT A — overlay, faithful to Dialog Example.jpg ---------- */
function renderA(s){
  const d=SCREENS[s];
  let inner;
  if(d.kind==='node') inner = dialog(d.npc)+
     `<div class="choices" data-ch style="max-height:38vh;position:relative">${optRows(d.opts)}</div>`;
  else if(d.kind==='form') inner = formHTML();
  else if(d.kind==='cta') inner = ctaHTML();
  else return `<img class="bg" src="${BG}" style="object-fit:cover">
               <div style="position:absolute;inset:0;background:rgba(6,10,20,.72);display:flex">${msgHTML(s)}</div>`;
  return `<img class="bg" src="${BG}" style="object-fit:cover;object-position:50% 22%">
    <div style="position:absolute;left:0;right:0;bottom:0;padding:10px 10px 14px;
                background:linear-gradient(to top,rgba(4,8,16,.82),rgba(4,8,16,0));">${inner}</div>`;
}

/* ---------- VARIANT B — letterboxed stage, chrome stacked BELOW ---------- */
function renderB(s){
  const d=SCREENS[s];
  let inner;
  if(d.kind==='node') inner = dialog(d.npc)+
     `<div class="choices" data-ch style="flex:1;min-height:0;position:relative">${optRows(d.opts)}</div>`;
  else if(d.kind==='form') inner = formHTML();
  else if(d.kind==='cta') inner = ctaHTML();
  else inner = msgHTML(s);
  return `<div style="height:42%;background:#0b1020;flex:none;display:flex;align-items:center;justify-content:center">
      <img src="${BG}" style="max-width:100%;max-height:100%;object-fit:contain;display:block">
    </div>
    <div style="flex:1;min-height:0;background:#0e1526;padding:10px;display:flex;flex-direction:column;
                overflow-y:auto">${inner}</div>`;
}

/* ---------- VARIANT C — adaptive bottom sheet, NPC never covered ---------- */
function renderC(s){
  const d=SCREENS[s];
  let inner, tall = (d.kind==='form');
  if(d.kind==='node') inner = dialog(d.npc)+
     `<div class="choices" data-ch style="flex:1;min-height:0;position:relative">${optRows(d.opts)}</div>`;
  else if(d.kind==='form') inner = formHTML();
  else if(d.kind==='cta') inner = ctaHTML();
  else inner = msgHTML(s);
  const h = tall ? '82%' : (d.kind==='msg' ? '46%' : '58%');
  return `<img class="bg" src="${BG}" style="object-fit:cover;object-position:50% 14%">
    <div style="position:absolute;left:0;right:0;bottom:0;height:${h};background:#0d1424f2;
                border-top:3px solid var(--frame-edge);border-radius:16px 16px 0 0;
                padding:8px 10px 12px;display:flex;flex-direction:column;overflow-y:auto;
                backdrop-filter:blur(2px)">
      <div style="width:42px;height:4px;background:#4b5670;border-radius:3px;margin:0 auto 9px;flex:none"></div>
      ${inner}
    </div>`;
}

/* ---------- state + wiring ---------- */
const q = new URLSearchParams(location.search);
let state = {
  variant: (q.get('variant')||'A').toUpperCase(),
  screen:  q.get('screen')||'interest',
  device:  q.get('device')||'iphone-14',
  font:    q.get('font')||'silkscreen',
  measure: q.get('measure')==='1'
};
if(!VARIANTS[state.variant]) state.variant='A';
if(!SCREENS[state.screen]) state.screen='interest';

const stage=document.getElementById('stage'), screenEl=document.getElementById('screen');

function syncURL(){
  const p=new URLSearchParams({variant:state.variant,screen:state.screen,device:state.device,font:state.font});
  if(state.measure) p.set('measure','1');
  history.replaceState(null,'','?'+p);
}
function render(){
  const dev=DEVICES[state.device];
  stage.style.width=dev.w+'px'; stage.style.height=dev.h+'px';
  document.documentElement.style.setProperty('--pixfont',FONTS[state.font].css);
  screenEl.innerHTML=VARIANTS[state.variant].render(state.screen);
  document.getElementById('vlabel').textContent=state.variant+' — '+VARIANTS[state.variant].name;
  document.body.classList.toggle('measuring',state.measure);
  syncURL();
  requestAnimationFrame(measure);
}
function measure(){
  if(!state.measure) return;
  const dev=DEVICES[state.device], out=[];
  out.push(`${dev.label}  ·  variant ${state.variant}  ·  ${FONTS[state.font].label}`);
  const dlg=screenEl.querySelector('[data-dlg]');
  if(dlg){
    const cs=getComputedStyle(dlg);
    const probe=document.createElement('span');
    probe.style.cssText=`position:absolute;visibility:hidden;white-space:pre;font:${cs.font}`;
    probe.textContent='M'; document.body.appendChild(probe);
    const chw=probe.getBoundingClientRect().width; probe.remove();
    const inner=dlg.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const cpl=Math.floor(inner/chw);
    const lines=Math.round(dlg.clientHeight/(parseFloat(cs.lineHeight)||16));
    out.push(`DIALOG  ${cpl} chars/line × ~${lines} lines  →  budget ≈ ${cpl*lines} chars`);
    if(dlg.scrollHeight>dlg.clientHeight+2) out.push('  ⚠ DIALOG OVERFLOWS at this size');
  }
  const ch=screenEl.querySelector('[data-ch]');
  if(ch){
    const rows=ch.querySelectorAll('.opt');
    let vis=0; const chTop=ch.getBoundingClientRect().top, chBot=ch.getBoundingClientRect().bottom;
    rows.forEach(r=>{const b=r.getBoundingClientRect(); if(b.top>=chTop-1 && b.bottom<=chBot+1) vis++;});
    out.push(`CHOICES ${rows.length} rows, ${vis} visible without scrolling`);
    if(vis<rows.length){
      out.push(`  ⚠ ${rows.length-vis} BELOW THE FOLD — biases BU popularity (tickets 05/10)`);
      if(!ch.querySelector('.scrollhint')){
        const s=document.createElement('div'); s.className='scrollhint pixel';
        s.textContent='▼ scroll'; ch.appendChild(s);
      }
    }
    const small=[...rows].filter(r=>r.getBoundingClientRect().height<44).length;
    if(small) out.push(`  ⚠ ${small} rows under the 44px tap-target minimum`);
  }
  document.getElementById('measure').textContent=out.join('\n');
}

// controls
const sSel=document.getElementById('screenSel');
Object.entries(SCREENS).forEach(([k,v])=>sSel.add(new Option(v.label,k)));
const dSel=document.getElementById('devSel');
Object.entries(DEVICES).forEach(([k,v])=>dSel.add(new Option(v.label,k)));
const fSel=document.getElementById('fontSel');
Object.entries(FONTS).forEach(([k,v])=>fSel.add(new Option(v.label,k)));
sSel.value=state.screen; dSel.value=state.device; fSel.value=state.font;
sSel.onchange=e=>{state.screen=e.target.value;render()};
dSel.onchange=e=>{state.device=e.target.value;render()};
fSel.onchange=e=>{state.font=e.target.value;render()};
const keys=Object.keys(VARIANTS);
function cycle(d){const i=keys.indexOf(state.variant);state.variant=keys[(i+d+keys.length)%keys.length];render()}
document.getElementById('prev').onclick=()=>cycle(-1);
document.getElementById('next').onclick=()=>cycle(1);
document.getElementById('measBtn').onclick=()=>{state.measure=!state.measure;render()};
addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable) return;
  if(e.key==='ArrowLeft')cycle(-1);
  else if(e.key==='ArrowRight')cycle(1);
  else if(e.key.toLowerCase()==='m'){state.measure=!state.measure;render()}
});
addEventListener('resize',()=>requestAnimationFrame(measure));
render();
</script>
</body>
</html>
